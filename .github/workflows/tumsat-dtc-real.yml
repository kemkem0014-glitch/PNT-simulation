name: TUMSAT real DTC orbit simulation

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/sky_aperture_leo/real_dtc_tumsat.py'
      - '.github/workflows/tumsat-dtc-real.yml'

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib requests sgp4

      - name: Run real DTC orbit simulation
        run: |
          python research/sky_aperture_leo/real_dtc_tumsat.py \
            --start 2026-10-06T00:00:00Z \
            --hours 24 \
            --coarse-step-s 5 \
            --start-step-min 2 \
            --max-wait-min 60 \
            --output-dir research/sky_aperture_leo/results/tumsat_real_dtc_20261006

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: tumsat-real-dtc-20261006
          path: research/sky_aperture_leo/results/tumsat_real_dtc_20261006

      - name: Commit reproducible results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/sky_aperture_leo/results/tumsat_real_dtc_20261006
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Add TUMSAT real DTC orbit waiting-time results"
            git push
          fi
