name: Validate reproduced 3D LEO-PNT EFIM
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-reproduced-3d.yml'
      - 'research/sky_aperture_leo/validate_reproduced_3d.py'
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python research/sky_aperture_leo/validate_reproduced_3d.py
      - name: Commit spot-check record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/sky_aperture_leo/results/reproduced_3d_20261006/direct_centering_validation.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record 3D EFIM direct-centering validation checks"
            git push
          fi
